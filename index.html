<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Gemini Guidance (ジェミニ誘導) - Retro Arcade STG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: radial-gradient(ellipse at 50% 35%, #102438 0%, #04070c 70%);
      color: #e6edf3;
      font-family: 'Press Start 2P', 'DotGothic16', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      touch-action: none;
      overscroll-behavior: none;
    }
    #game-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      max-width: min(760px, 100vw);
      max-height: 100dvh;
      padding: 4px;
    }
    #game-container {
      position: relative;
      box-shadow: 0 0 16px rgba(0, 150, 255, 0.22);
      border-radius: 12px;
      overflow: hidden;
      border: 3px solid #1a2736;
      background: #081018;
      width: min(400px, calc(100vw - 12px), calc((100dvh - 56px) * 360 / 540));
      aspect-ratio: 360 / 540;
      touch-action: none;
      overscroll-behavior: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      touch-action: none;
    }
    #arcade-footer {
      margin-top: 6px;
      font-size: 11px;
      color: #94a3b8;
      text-align: center;
      line-height: 1.5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Meiryo", "Noto Sans JP", sans-serif;
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn-toggle {
      background: #14202e;
      border: 1px solid #2b4058;
      color: #9cb3cc;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 10px;
      cursor: pointer;
      font-family: 'Press Start 2P', monospace;
    }
    .btn-toggle:hover {
      background: #1f334a;
      color: #e0edfb;
    }
    @media (max-height: 650px) {
      #arcade-footer {
        font-size: 9px;
        margin-top: 2px;
      }
      .btn-toggle {
        font-size: 8px;
        padding: 2px 5px;
      }
    }
  </style>
</head>
<body>
  <div id="game-wrapper">
    <div id="game-container">
      <canvas id="game-canvas" width="360" height="540" aria-label="ジェミニ誘導・縦スクロールシューティング">HTML5 Canvas 対応ブラウザでプレイしてください。</canvas>
    </div>
    <div id="arcade-footer">
      <span>📱 スマホ: ドラッグ(自機移動) / 右下「⚡捕獲」ボタンまたは2本指タッチでヒモ捕獲・離して投擲！</span>
      <span>PC: WASD移動 | 左長押し: 捕獲・防御 → 離す: 投擲 | 右クリック: 壁反射 | 中クリック: 一時停止</span>
      <button id="btn-wall" class="btn-toggle" title="画面端の壁 反射/通過切替 (右クリック)">🚪 壁: 通過OFF [右クリック]</button>
      <button id="btn-bgm" class="btn-toggle" title="BGM切替 (Bキー)">🎵 BGM: ON</button>
      <button id="btn-se" class="btn-toggle" title="効果音切替 (Nキー)">🔊 SE: ON</button>
      <button id="btn-all-audio" class="btn-toggle" title="全ミュート">🔇 全消音</button>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
