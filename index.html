<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Gemini Guidance (ジェミニ誘導) - Retro Arcade STG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: #04070c;
      color: #e6edf3;
      font-family: 'Press Start 2P', 'DotGothic16', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      touch-action: none;
      overscroll-behavior: none;
    }
    #game-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      max-width: 100vw;
      max-height: 100dvh;
      padding: 4px;
    }
    #game-container {
      position: relative;
      box-shadow: 0 0 30px rgba(0, 150, 255, 0.25), 0 0 60px rgba(180, 0, 255, 0.15);
      border-radius: 12px;
      overflow: hidden;
      border: 3px solid #1a2736;
      background: #081018;
      width: min(400px, calc(100vw - 12px), calc((100dvh - 56px) * 360 / 540));
      aspect-ratio: 360 / 540;
      touch-action: none;
      overscroll-behavior: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      touch-action: none;
    }
    #arcade-footer {
      margin-top: 6px;
      font-size: 10px;
      color: #7d8b99;
      text-align: center;
      line-height: 1.5;
      font-family: 'DotGothic16', monospace;
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn-toggle {
      background: #14202e;
      border: 1px solid #2b4058;
      color: #9cb3cc;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 10px;
      cursor: pointer;
      font-family: 'Press Start 2P', monospace;
    }
    .btn-toggle:hover {
      background: #1f334a;
      color: #e0edfb;
    }
    @media (max-height: 650px) {
      #arcade-footer {
        font-size: 8px;
        margin-top: 2px;
      }
      .btn-toggle {
        font-size: 8px;
        padding: 2px 5px;
      }
    }
  </style>
</head>
<body>
  <div id="game-wrapper">
    <div id="game-container">
      <canvas id="game-canvas" width="360" height="540"></canvas>
    </div>
    <div id="arcade-footer">
      <span>📱 1本指ドラッグ: 移動・誘導 / 画面タップで攻撃選択</span>
      <span>💻 PC: WASD [Space]攻撃 [X]貫通/反射 [B]BGM [N]SE</span>
      <button id="btn-bgm" class="btn-toggle" title="BGM切替 (Bキー)">🎵 BGM: ON</button>
      <button id="btn-se" class="btn-toggle" title="効果音切替 (Nキー)">🔊 SE: ON</button>
      <button id="btn-all-audio" class="btn-toggle" title="全ミュート (Mキー)">🔇 全消音</button>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
